[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemma-graph"
version = "0.3.0"
description = "Portable question-scoped genealogy graphs: a stemma for your own writing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
